ive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-809a-81d8-d95880089521":{"value":{"id":"373fd514-60c1-809a-81d8-d95880089521","version":3,"type":"code","properties":{"title":[["_Albedo (\"Albedo\", 2D) = \"white\" {}\n_BaseColor(\"Base Color\", Color) = (1.0, 1.0, 1.0, 1.0)\n_MetallicTex (\"Metallic Tex\", 2D) = \"white\" {}\n_Metallic (\"Metallic\", Range(0,1)) = 0.0\n_RoughnessTex (\"Roughness Tex\", 2D) = \"white\" {}\n_Roughness (\"Roughness\", Range(0,1)) = 0.5\n_NormalTex (\"Normal Tex\", 2D) = \"bump\" {}\n_NormalScale (\"Normal Scale\",Range(0, 1)) = 0.5\n_OcculsionTex (\"Occlusion Tex\", 2D) = \"white\" {}\n_OcclusionStrength (\"Occlusion Strength\", Range(0,1)) = 1.0\n_EmissionTex (\"Emission Tex\", 2D) = \"white\" {}\n_EmissionIntensity (\"Emission Intensity\", Range(0,10)) = 1.0"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863793,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8070-b2ae-ca87086b02fd":{"value":{"id":"373fd514-60c1-8070-b2ae-ca87086b02fd","version":3,"type":"header","properties":{"title":[["向量、贴图"]]},"created_time":1780412863793,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80fd-b4ae-dd16af83700e":{"value":{"id":"373fd514-60c1-80fd-b4ae-dd16af83700e","version":3,"type":"code","properties":{"title":[["// 向量准备\nhalf3 normalWS = normalize(input.normalWS);\nhalf3 tangentWS = normalize(input.tangentWS);\nhalf3 bitangentWS = cross(normalWS, tangentWS);\nhalf3x3 TBN = half3x3(tangentWS, bitangentWS, normalWS);\nfloat3 positionWS = input.positionWS;\nhalf4 shadowMask = half4 (1.0, 1.0, 1.0, 1.0);\nhalf3 viewDir = GetWorldSpaceNormalizeViewDir(positionWS);\n\n// 主光源\nLight mainLight = GetMainLight(input.shadowCoord, positionWS, shadowMask);\nfloat shadow = mainLight.shadowAttenuation;\nfloat3 lightDir = mainLight.direction;\nfloat3 lightColor = mainLight.color;\n\n// 贴图采样\nfloat4 baseMap = SAMPLE_TEXTURE2D(_Albedo, sampler_Albedo, input.uv) * _BaseColor;\nfloat metallic = _Metallic * SAMPLE_TEXTURE2D(_MetallicMap, sampler_MetallicMap, input.uv).r;\nfloat roughness = _Roughness * SAMPLE_TEXTURE2D(_RoughnessMap, sampler_RoughnessMap, input.uv).r;\nfloat4 normalMap = SAMPLE_TEXTURE2D(_NormalMap, sampler_NormalMap, input.uv);\nfloat3 normalMapTS = UnpackNormalScale(normalMap,_NormalScale);\nfloat3 normalMapWS = normalize(mul(normalMapTS, TBN));\nfloat occlusionMap = SAMPLE_TEXTURE2D(_OcculsionMap, sampler_OcculsionMap, input.uv).r;\nfloat3 Emission = SAMPLE_TEXTURE2D(_EmissionMap, sampler_EmissionMap, input.uv).rgb * _EmissionIntensity;\nfloat occlusion = lerp(1.0, occlusionMap, _OcclusionStrength);"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863793,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80ca-af57-dfe3e7f3883b":{"value":{"id":"373fd514-60c1-80ca-af57-dfe3e7f3883b","version":3,"type":"header","properties":{"title":[["BRDF参数"]]},"created_time":1780412863794,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8009-9580-e9f6af2c110b":{"value":{"id":"373fd514-60c1-8009-9580-e9f6af2c110b","version":3,"type":"text","properties":{"title":[["在金属粗糙度工作流中，从BaseMap/Albedo中获取DiffuseColor和SpcularColor"]]},"created_time":1780412863794,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8058-8d33-dd407ce62558":{"value":{"id":"373fd514-60c1-8058-8d33-dd407ce62558","version":3,"type":"code","properties":{"title":[["float3 DiffuseColor = lerp(baseMap * (1 - 0.04), 0, metallic);\nfloat3 SpecualrColor = lerp(0.04, baseMap, metallic);"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863794,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-804c-910b-dba7eb27ca94":{"value":{"id":"373fd514-60c1-804c-910b-dba7eb27ca94","version":3,"type":"header","properties":{"title":[["直接光"]]},"created_time":1780412863794,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80d0-8614-e7f8086fbc43":{"value":{"id":"373fd514-60c1-80d0-8614-e7f8086fbc43","version":3,"type":"sub_sub_header","properties":{"title":[["漫反射"]]},"created_time":1780412863795,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-808d-97e7-d470fad09b44":{"value":{"id":"373fd514-60c1-808d-97e7-d470fad09b44","version":3,"type":"code","properties":{"title":[["float3 Diffuse_Lambert( float3 DiffuseColor )\n{\n    return DiffuseColor * (1 / PI);\n}"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863795,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-809c-8076-e99da9d11da2":{"value":{"id":"373fd514-60c1-809c-8076-e99da9d11da2","version":3,"type":"sub_sub_header","properties":{"title":[["镜面反射"]]},"created_time":1780412863795,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-803c-8751-e91e27fdd268":{"value":{"id":"373fd514-60c1-803c-8751-e91e27fdd268","version":4,"type":"text","properties":{"title":[["D项",[["b"]]]]},"created_time":1780412863795,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-808e-98a3-c41b43c0bc1c":{"value":{"id":"373fd514-60c1-808e-98a3-c41b43c0bc1c","version":3,"type":"code","properties":{"title":[["// GGX / Trowbridge-Reitz\n// [Walter et al. 2007, \"Microfacet models for refraction through rough surfaces\"]\nfloat D_GGX( float a2, float NoH )\n{\n    float d = ( NoH * a2 - NoH ) * NoH + 1;\t// 2 mad\n    return a2 / ( PI*d*d );\t\t\t\t\t// 4 mul, 1 rcp\n}"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863796,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80f3-8b6b-c79eaafa726a":{"value":{"id":"373fd514-60c1-80f3-8b6b-c79eaafa726a","version":4,"type":"text","properties":{"title":[["F项",[["b"]]]]},"created_time":1780412863796,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80d5-9990-c6075909661e":{"value":{"id":"373fd514-60c1-80d5-9990-c6075909661e","version":3,"type":"code","properties":{"title":[["// [Schlick 1994, \"An Inexpensive BRDF Model for Physically-Based Rendering\"]\nfloat3 F_Schlick( float3 SpecularColor, float VoH )\n{\n    float Fc = Pow5( 1 - VoH );\t\t\t\t\t// 1 sub, 3 mul\n    //return Fc + (1 - Fc) * SpecularColor;\t\t// 1 add, 3 mad\n\n    // Anything less than 2% is physically impossible and is instead considered to be shadowing\n    return saturate( 50.0 * SpecularColor.g ) * Fc + (1 - Fc) * SpecularColor;\n}"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863797,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8046-bd5e-d692b709eb31":{"value":{"id":"373fd514-60c1-8046-bd5e-d692b709eb31","version":4,"type":"text","properties":{"title":[["V项",[["b"]]]]},"created_time":1780412863797,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80c2-ab8f-d520a90f8d12":{"value":{"id":"373fd514-60c1-80c2-ab8f-d520a90f8d12","version":3,"type":"code","properties":{"title":[["// Appoximation of joint Smith term for GGX\n// [Heitz 2014, \"Understanding the Masking-Shadowing Function in Microfacet-Based BRDFs\"]\nfloat Vis_SmithJointApprox( float a2, float NoV, float NoL )\n{\n    float a = sqrt(max(a2, 1e-7));\n    float Vis_SmithV = NoL * ( NoV * ( 1 - a ) + a );\n    float Vis_SmithL = NoV * ( NoL * ( 1 - a ) + a );\n    return 0.5 * rcp( Vis_SmithV + Vis_SmithL + 1e-5 );\n}"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863797,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-809a-be20-cb32c9883da6":{"value":{"id":"373fd514-60c1-809a-be20-cb32c9883da6","version":3,"type":"text","properties":{"title":[["V项就是将 公式中的分母和G项放在一起计算"]]},"created_time":1780412863798,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80c8-a61d-dcde9728b00d":{"value":{"id":"373fd514-60c1-80c8-a61d-dcde9728b00d","version":4,"type":"sub_sub_header","properties":{"title":[["整合",[["b"]]]]},"created_time":1780412863798,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-800f-9ea0-c51182e5d600":{"value":{"id":"373fd514-60c1-800f-9ea0-c51182e5d600","version":3,"type":"code","properties":{"title":[["float D = D_GGX_UE(a2, NoH);\nfloat Vis = Vis_SmithJointApprox(a2, NoV, NoL);\nfloat3 F = F_Schlick_UE(SpecularColor, VoH);\n\nfloat3 DiffuseTerm = Diffuse_Lambert(DiffuseColor) * Radiance;\nfloat3 SpecularTerm = D * Vis * F * Radiance;\n\nfloat3 kS = F; // 镜面反射系数\nfloat3 kD = (1.0 - kS) * (1.0 - metallic); // 剩下的才是漫反射\nfloat3 DirectLighting = kD * DiffuseTerm + SpecularTerm;"]],"language":[["GLSL"]]},"format":{"code_wrap":true},"created_time":1780412863798,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80af-9c28-f26a1dad8fb9":{"value":{"id":"373fd514-60c1-80af-9c28-f26a1dad8fb9","version":3,"type":"text","properties":{"title":[["多光源和主光计算逻辑一样，for循环处理每一盏灯"]]},"created_time":1780412863798,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8081-8993-d01d6a0bcda4":{"value":{"id":"373fd514-60c1-8081-8993-d01d6a0bcda4","version":2,"type":"divider","created_time":1780412863799,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8022-9838-ee48bbf7806c":{"value":{"id":"373fd514-60c1-8022-9838-ee48bbf7806c","version":3,"type":"header","properties":{"title":[["间接光"]]},"created_time":1780412863799,"last_edited_time":1780412863843,"parent_id":"373fd514-60c1-80b7-90a2-df0a5b38b5bf","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8077-bfb8-c03dd0a86986" f7b-dcc13b1274b3","version":4,"type":"bulleted_list","properties":{"title":[["次表面散射（Subsurface Scattering）：",[["b"]]],["观察像素小于散射距离，散射被视作次表面散射"]]},"created_time":1780412781289,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-805c-8e43-f15603edb8a8":{"value":{"id":"373fd514-60c1-805c-8e43-f15603edb8a8","version":4,"type":"bulleted_list","properties":{"title":[["漫反射（Diffuse）：",[["b"]]],["观察像素大于散射距离，散射被视作漫反射"]]},"created_time":1780412781294,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-801c-a957-d3d5890a7429":{"value":{"id":"373fd514-60c1-801c-a957-d3d5890a7429","version":4,"type":"bulleted_list","properties":{"title":[["透射（Transmission）：",[["b"]]],["入射光经过折射穿过物体后的出射现象。透射为次表面散射的特例"]]},"created_time":1780412781295,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80b4-b2eb-c6f3750750f5":{"value":{"id":"373fd514-60c1-80b4-b2eb-c6f3750750f5","version":4,"type":"bulleted_list","properties":{"title":[["吸收（Absorption）",[["b"]]],["具有复折射率的物质区域会引起吸收"]]},"created_time":1780412781295,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80d7-b60e-eb1247133a56":{"value":{"id":"373fd514-60c1-80d7-b60e-eb1247133a56","version":4,"type":"sub_sub_header","properties":{"title":[["不同物质与光的交互",[["b"]]]]},"created_time":1780412781296,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80e0-a897-d77d9a4ce826":{"value":{"id":"373fd514-60c1-80e0-a897-d77d9a4ce826","version":3,"type":"text","properties":{"title":[["上文已经提到，光线入射到两种介质之间平面边界时，会发生反射和折射。"]]},"created_time":1780412781296,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8091-b623-fcf27b47cf94":{"value":{"id":"373fd514-60c1-8091-b623-fcf27b47cf94","version":3,"type":"text","properties":{"title":[["而根据材质光学性质的不同，具有不同的行为表现，从而得到不同的材质外观。"]]},"created_time":1780412781296,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8043-bf99-d2f038bc9b81":{"value":{"id":"373fd514-60c1-8043-bf99-d2f038bc9b81","version":3,"type":"text","properties":{"title":[["可以将材质根据光学特性，分为金属和非金属两大类，具体行为可以总结如下："]]},"created_time":1780412781297,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80d9-a629-df0ba58ffe95":{"value":{"id":"373fd514-60c1-80d9-a629-df0ba58ffe95","version":5,"type":"bulleted_list","properties":{"title":[["金属（Metal）",[["b"]]],["。金属的外观主要取决于光线在两种介质的交界面上的直接反射（即镜面反射）。"],["金属的镜面反射颜色为三通道的彩色，R、G、B各不相同",[["b"]]],["。而折射入金属内部的光线几乎立即全部被自由电子吸收，且折射入金属的光不存在散射。"]]},"created_time":1780412781297,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-800d-9a5f-d6fc36501511":{"value":{"id":"373fd514-60c1-800d-9a5f-d6fc36501511","version":4,"type":"bulleted_list","properties":{"title":[["非金属（No-Metal）",[["b"]]],["。非金属即电介质，其的整体外观主要由其吸收和散射的特性组合决定。同样，非金属与光的交互分为反射和折射两部分。而折射按介质类型的散射和吸收特性，分为多类，这里略。"]]},"created_time":1780412781297,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-802a-a03c-f0eaaee66d8f":{"value":{"id":"373fd514-60c1-802a-a03c-f0eaaee66d8f","version":2,"type":"divider","created_time":1780412781298,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-8080-8d5a-e058a2f229c2":{"value":{"id":"373fd514-60c1-8080-8d5a-e058a2f229c2","version":4,"type":"text","properties":{"title":[["概念：",[["b"]]],["出射光线的能量 永远不能大于 入射光线的能量"]]},"created_time":1780412781298,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-808d-9692-cc7938aa07e6":{"value":{"id":"373fd514-60c1-808d-9692-cc7938aa07e6","version":4,"type":"text","properties":{"title":[["表现：",[["b"]]],["随着粗糙度的上升镜面反射区域的面积会增加，作为平衡，镜面反射区域的平均亮度则会下降"]]},"created_time":1780412781298,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80aa-a420-e5b1d2eb0b27":{"value":{"id":"373fd514-60c1-80aa-a420-e5b1d2eb0b27","version":3,"type":"image","properties":{"source":[["https://cdn.nlark.com/yuque/0/2026/png/43147238/1774076922794-04b4f105-2983-4936-8ce2-14fe7c1e4c4e.png"]]},"format":{"block_width":700},"created_time":1780412781298,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"0e336148-4893-4418-8b5a-c44c924dbc55"}},"373fd514-60c1-80f6-91ab-e8aeb8d1dfc7":{"value":{"id":"373fd514-60c1-80f6-91ab-e8aeb8d1dfc7","version":3,"type":"text","properties":{"title":[["能量守恒应用到PBR中，可以用渲染方程来描述"]]},"created_time":1780412781299,"last_edited_time":1780412781457,"parent_id":"373fd514-60c1-806d-a3c5-c5e2a16cb6f6","parent_table":"block","alive":true,"space_id":"
